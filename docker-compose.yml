version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped

    volumes:
      - mongo-data:/data/db

    networks:
      - mern-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    depends_on:
      - mongo

    networks:
      - mern-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - mern-network

networks:
  mern-network:
    driver: bridge

volumes:
  mongo-data:
